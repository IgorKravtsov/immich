name: SideStore

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'native/**'
      - 'i18n/**'
      - 'open-api/**'
      - '.github/workflows/sidestore.yml'
  workflow_dispatch:

concurrency:
  group: sidestore
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: sidestore
  BUNDLE_ID: com.kravtsov.immich
  GROUP_ID: group.com.kravtsov.immich

jobs:
  ipa:
    name: Build the .ipa and update the source
    if: github.repository != 'immich-app/immich'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"

      - uses: jdx/mise-action@v3
        with:
          working_directory: mobile

      - name: Install Ruby gems
        working-directory: mobile/ios
        run: bundle install

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Codegen
        run: mise //mobile:codegen

      - name: Bundle and group IDs
        run: |
          printf 'IMMICH_TEAM_ID =\nIMMICH_BUNDLE_ID_PROD = %s\nIMMICH_BUNDLE_ID_DEV = %s.dev\nIMMICH_GROUP_ID = %s\n' \
            "$BUNDLE_ID" "$BUNDLE_ID" "$GROUP_ID" > mobile/ios/Signing.local.xcconfig

      - name: Build
        id: build
        run: |
          ipa="$(mobile/ios/scripts/build-sidestore-ipa.sh "$PWD/dist" | tail -1)"
          test -s "$ipa"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sidestore-ipa
          path: ${{ steps.build.outputs.ipa }}

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.build.outputs.ipa }}
          REPO: ${{ github.repository }}
        run: |
          name="$(basename "$IPA")"
          base="https://github.com/$REPO/releases/download/$RELEASE_TAG"
          unzip -p "$IPA" "Payload/*.app/Info.plist" > "$RUNNER_TEMP/Info.plist"
          python3 - "$RUNNER_TEMP/Info.plist" > "$RUNNER_TEMP/app.json" <<'PY'
          import json, plistlib, sys
          p = plistlib.load(open(sys.argv[1], "rb"))
          print(json.dumps({
              "bundle": p["CFBundleIdentifier"],
              "version": p["CFBundleShortVersionString"],
              "build": p["CFBundleVersion"],
              "minos": p["MinimumOSVersion"],
              "privacy": {k: v for k, v in p.items() if k.startswith("NS") and k.endswith("UsageDescription")},
          }))
          PY
          build="$(jq -r .build "$RUNNER_TEMP/app.json")"

          gh release view "$RELEASE_TAG" --repo "$REPO" > /dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$REPO" --prerelease --latest=false \
              --title "Immich for SideStore" \
              --notes "Add the source $base/apps.json in SideStore → Sources to install Immich and get its updates."

          if gh release download "$RELEASE_TAG" --repo "$REPO" --pattern apps.json --output "$RUNNER_TEMP/published.json" 2> /dev/null; then
            published="$(jq -r '.apps[0].versions[0].buildVersion' "$RUNNER_TEMP/published.json")"
            if [ "$published" -ge "$build" ] 2> /dev/null; then
              echo "The source already offers build $published, not older than $build; leaving it."
              exit 0
            fi
          fi

          gh release upload "$RELEASE_TAG" "$IPA" --repo "$REPO" --clobber
          cp mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png "$RUNNER_TEMP/icon.png"
          jq -n --slurpfile app "$RUNNER_TEMP/app.json" \
            --arg base "$base" --arg url "$base/$name" --argjson size "$(stat -f %z "$IPA")" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg commit "https://github.com/$REPO/commit/$GITHUB_SHA" '
            $app[0] as $a | {
              name: "Immich", identifier: "\($a.bundle).source", sourceURL: "\($base)/apps.json", iconURL: "\($base)/icon.png",
              apps: [{
                name: "Immich", bundleIdentifier: $a.bundle, developerName: "Immich",
                subtitle: "Self-hosted photo and video backup", iconURL: "\($base)/icon.png", tintColor: "#4250AF",
                localizedDescription: "Immich mobile app built from \($commit)",
                versions: [{ version: $a.version, buildVersion: $a.build, date: $date, size: $size, downloadURL: $url,
                             minOSVersion: $a.minos, localizedDescription: "Built from \($commit)" }],
                appPermissions: { entitlements: ["com.apple.security.application-groups"], privacy: $a.privacy }
              }],
              news: []
            }' > "$RUNNER_TEMP/apps.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/icon.png" --repo "$REPO" --clobber

          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets \
            --jq '[.assets[] | select(.name | endswith(".ipa"))] | sort_by(.createdAt) | reverse | .[3:][] | .name' \
            | while read -r old; do gh release delete-asset "$RELEASE_TAG" "$old" --repo "$REPO" --yes; done
